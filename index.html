<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Coding Club</title>

    <!-- Hubungkan CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="card">

            <!-- Badge -->
            <div class="badge">🚀 Gen-Z Developer</div>

            <!-- Judul -->
            <h1>Join Coding Club</h1>
            <p class="subtitle">
                Daftarkan dirimu dan mulai bikin web keren bersama!
            </p>

            <!-- Form -->
            <form>

                <label for="nama">Nama Lengkap</label>
                <input 
                    type="text" 
                    id="nama" 
                    placeholder="Contoh: Saffiyyah Azziaty Zahrani"
                >

                <label for="kelas">Kelas</label>
                <input 
                    type="text" 
                    id="kelas" 
                    placeholder="Contoh: XI RPL 1"
                >

                <label for="alasan">Kenapa ingin bergabung?</label>
                <textarea 
                    id="alasan" 
                    placeholder="Tulis alasan singkatmu di sini..."
                ></textarea>

                <button type="submit">
                    Kirim Pendaftaran ✨
                </button>

            </form>

        </div>
    </div>

</body>
</html>
